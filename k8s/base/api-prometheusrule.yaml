apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskflow-api-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: taskflow-api.rules
      rules:
        - alert: TaskFlowAPIHighErrorRate
          expr: sum(rate(taskflow_http_requests_total{status=~"5.."}[5m])) > 0
          for: 1m
          labels:
            severity: warning
            app: taskflow
          annotations:
            summary: "TaskFlow API returns 5xx errors"
            description: "TaskFlow API has returned 5xx responses for more than 1 minute."

        - alert: TaskFlowAPIHighLatency
          expr: histogram_quantile(0.95, sum(rate(taskflow_http_request_duration_seconds_bucket[5m])) by (le)) > 0.05
          for: 2m
          labels:
            severity: warning
            app: taskflow
          annotations:
            summary: "TaskFlow API latency is high"
            description: "TaskFlow API p95 latency is above 500ms for more than 2 minutes."

        - alert: TaskFlowAPITargetDown
          expr: up{namespace="default", service="api-service"} == 0
          for: 1m
          labels:
            severity: critical
            app: taskflow
          annotations:
            summary: "TaskFlow API Prometheus target is down"
            description: "Prometheus cannot scrape TaskFlow API metrics."

        - alert: TaskFlowAPIRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="default", container="api"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
            app: taskflow
          annotations:
            summary: "TaskFlow API container restarted"
            description: "TaskFlow API container restarted during the last 10 minutes."
