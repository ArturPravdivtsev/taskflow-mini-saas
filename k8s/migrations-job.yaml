apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: taskflow-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: taskflow-migrations:dev
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
