{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  labels:
    app: "api"
    app.kubernetes.io/name: "taskflow"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "{{ .Values.api.name }}"

  minReplicas: !!int "{{ .Values.api.hpa.minReplicas }}"
  maxReplicas: !!int "{{ .Values.api.hpa.maxReplicas }}"

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: !!int "{{ .Values.api.hpa.averageUtilization }}"
{{- end }}
