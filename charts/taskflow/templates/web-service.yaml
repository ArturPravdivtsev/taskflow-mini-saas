apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: "web"
    app.kubernetes.io/name: "taskflow"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  selector:
    app: "web"
  ports:
    - name: http
      port: !!int "{{ .Values.web.port }}"
      targetPort: !!int "{{ .Values.web.port }}"
