{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: "postgres"
    app.kubernetes.io/name: "taskflow"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  selector:
    app: "postgres"
  ports:
    - name: postgres
      port: !!int "{{ .Values.postgres.port }}"
      targetPort: !!int "{{ .Values.postgres.port }}"
{{- end }}
