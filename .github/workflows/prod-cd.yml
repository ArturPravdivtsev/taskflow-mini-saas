name: Production CD

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy to production"
        required: true
        type: string

concurrency:
  group: taskflow-prod-cd
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ inputs.image_tag }}
  KUBE_NAMESPACE: taskflow-prod
  APP_HOST: prod.taskflow.local

jobs:
  deploy:
    name: Promote image to production
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize owner
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"

      - name: Create Kubernetes secrets
        env:
          TASKFLOW_API_TOKEN: ${{ secrets.TASKFLOW_API_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -e

          if [ -z "$TASKFLOW_API_TOKEN" ]; then
            echo "TASKFLOW_API_TOKEN is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_USER" ]; then
            echo "POSTGRES_USER is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_DB" ]; then
            echo "POSTGRES_DB is empty"
            exit 1
          fi

          if [ -z "$GHCR_USERNAME" ]; then
            echo "GHCR_USERNAME is empty"
            exit 1
          fi

          if [ -z "$GHCR_READ_TOKEN" ]; then
            echo "GHCR_READ_TOKEN is empty"
            exit 1
          fi

          kubectl create secret generic api-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=API_TOKEN="$TASKFLOW_API_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic postgres-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres-service:5432/$POSTGRES_DB" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$KUBE_NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_READ_TOKEN" \
            --docker-email="deadpoollyo@gmail.com" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Check restricted Kubernetes access
        run: |
          kubectl config current-context
          kubectl get pods -n "$KUBE_NAMESPACE"
          kubectl auth can-i get pods -n "$KUBE_NAMESPACE"
          kubectl auth can-i get pods -n kube-system || true

      - name: Check Docker and Kubernetes
        run: |
          docker version
          kubectl config current-context
          kubectl get pods -n "$KUBE_NAMESPACE"
          kubectl auth can-i get pods -n "$KUBE_NAMESPACE"

      - name: Login to GHCR for pull
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -e

          if [ -z "$GHCR_USERNAME" ]; then
            echo "GHCR_USERNAME is empty"
            exit 1
          fi

          if [ -z "$GHCR_READ_TOKEN" ]; then
            echo "GHCR_READ_TOKEN is empty"
            exit 1
          fi

          echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Check selected images exist
        run: |
          docker pull ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG
          docker pull ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG
          docker pull ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG

      - name: Create Kubernetes secrets
        env:
          TASKFLOW_API_TOKEN: ${{ secrets.TASKFLOW_API_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -e

          if [ -z "$TASKFLOW_API_TOKEN" ]; then echo "TASKFLOW_API_TOKEN is empty"; exit 1; fi
          if [ -z "$POSTGRES_USER" ]; then echo "POSTGRES_USER is empty"; exit 1; fi
          if [ -z "$POSTGRES_PASSWORD" ]; then echo "POSTGRES_PASSWORD is empty"; exit 1; fi
          if [ -z "$POSTGRES_DB" ]; then echo "POSTGRES_DB is empty"; exit 1; fi
          if [ -z "$GHCR_USERNAME" ]; then echo "GHCR_USERNAME is empty"; exit 1; fi
          if [ -z "$GHCR_READ_TOKEN" ]; then echo "GHCR_READ_TOKEN is empty"; exit 1; fi

          kubectl create secret generic api-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=API_TOKEN="$TASKFLOW_API_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic postgres-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres-service:5432/$POSTGRES_DB" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$KUBE_NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_READ_TOKEN" \
            --docker-email="deadpoollyo@gmail.com" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Wait for PostgreSQL
        run: kubectl rollout status statefulset/postgres -n "$KUBE_NAMESPACE" --timeout=180s

      - name: Run database migrations
        run: |
          MIGRATION_JOB_NAME="taskflow-migrations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Running migration job: $MIGRATION_JOB_NAME"

          sed \
            -e "s|name: taskflow-migrations|name: $MIGRATION_JOB_NAME|g" \
            -e "s|app: taskflow-migrations|app: $MIGRATION_JOB_NAME|g" \
            -e "s|ghcr.io/<GITHUB_OWNER>/taskflow-migrations:latest|ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG|g" \
            k8s/base/migrations-job.yaml \
            | kubectl apply -n "$KUBE_NAMESPACE" -f -

          kubectl wait -n "$KUBE_NAMESPACE" \
            --for=condition=complete job/$MIGRATION_JOB_NAME \
            --timeout=180s || (
              echo "Migration job did not complete. Debug info:"
              kubectl get jobs -n "$KUBE_NAMESPACE"
              kubectl describe job "$MIGRATION_JOB_NAME" -n "$KUBE_NAMESPACE"
              kubectl get pods -n "$KUBE_NAMESPACE" -l app="$MIGRATION_JOB_NAME" -o wide
              kubectl describe pod -n "$KUBE_NAMESPACE" -l app="$MIGRATION_JOB_NAME"
              kubectl logs -n "$KUBE_NAMESPACE" job/$MIGRATION_JOB_NAME --all-containers || true
              exit 1
            )

          kubectl logs -n "$KUBE_NAMESPACE" job/$MIGRATION_JOB_NAME

      - name: Commit prod image tag
        run: |
          set -e

          {
            printf '%s\n' 'apiVersion: apps/v1'
            printf '%s\n' 'kind: Deployment'
            printf '%s\n' 'metadata:'
            printf '%s\n' '  name: api'
            printf '%s\n' 'spec:'
            printf '%s\n' '  template:'
            printf '%s\n' '    spec:'
            printf '%s\n' '      containers:'
            printf '%s\n' '        - name: api'
            printf '%s\n' "          image: ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG"
            printf '%s\n' '---'
            printf '%s\n' 'apiVersion: apps/v1'
            printf '%s\n' 'kind: Deployment'
            printf '%s\n' 'metadata:'
            printf '%s\n' '  name: web'
            printf '%s\n' 'spec:'
            printf '%s\n' '  template:'
            printf '%s\n' '    spec:'
            printf '%s\n' '      containers:'
            printf '%s\n' '        - name: web'
            printf '%s\n' "          image: ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG"
          } > k8s/overlays/prod/images-patch.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/prod/images-patch.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
          else
            git commit -m "chore(prod): promote image $IMAGE_TAG [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Wait for Argo CD prod rollout
        run: |
          set -e

          API_IMAGE="ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG"
          WEB_IMAGE="ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG"

          echo "Waiting for API image: $API_IMAGE"
          for i in {1..60}; do
            CURRENT_API_IMAGE=$(kubectl get deployment api -n "$KUBE_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "Current API image: $CURRENT_API_IMAGE"

            if [ "$CURRENT_API_IMAGE" = "$API_IMAGE" ]; then
              break
            fi

            sleep 5
          done

          if [ "$CURRENT_API_IMAGE" != "$API_IMAGE" ]; then
            echo "Argo CD did not apply API image in time"
            exit 1
          fi

          echo "Waiting for WEB image: $WEB_IMAGE"
          for i in {1..60}; do
            CURRENT_WEB_IMAGE=$(kubectl get deployment web -n "$KUBE_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
            echo "Current WEB image: $CURRENT_WEB_IMAGE"

            if [ "$CURRENT_WEB_IMAGE" = "$WEB_IMAGE" ]; then
              break
            fi

            sleep 5
          done

          if [ "$CURRENT_WEB_IMAGE" != "$WEB_IMAGE" ]; then
            echo "Argo CD did not apply WEB image in time"
            exit 1
          fi

          kubectl rollout status deployment api -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment web -n "$KUBE_NAMESPACE" --timeout=180s
      - name: Wait for deployments
        run: |
          kubectl rollout status deployment api -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment web -n "$KUBE_NAMESPACE" --timeout=180s

      - name: Smoke test
        run: |
          curl -f http://$APP_HOST/api/health
          curl -f http://$APP_HOST/api/tasks
