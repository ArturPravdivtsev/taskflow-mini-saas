name: Local CD with GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}
  KUBE_NAMESPACE: taskflow-dev
  APP_HOST: dev.taskflow.local

jobs:
  deploy:
    name: Build, push and deploy to local Kubernetes
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize owner
        run: |
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LC=$OWNER_LC" >> "$GITHUB_ENV"

      - name: Print image names
        run: |
          echo "API image: ghcr.io/$OWNER_LC/taskflow-api:latest"
          echo "WEB image: ghcr.io/$OWNER_LC/taskflow-web:latest"
          echo "Migrations image: ghcr.io/$OWNER_LC/taskflow-migrations:latest"

      - name: Check Docker and Kubernetes
        run: |
          docker version
          kubectl config current-context
          kubectl get nodes

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install Web dependencies
        run: npm ci
        working-directory: taskflow-web

      - name: Build Web
        run: npm run build
        working-directory: taskflow-web

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker images
        run: |
          docker build \
            -t ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG \
            -t ghcr.io/$OWNER_LC/taskflow-api:latest \
            ./api

          docker build \
            -t ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG \
            -t ghcr.io/$OWNER_LC/taskflow-web:latest \
            ./taskflow-web

          docker build \
            -t ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG \
            -t ghcr.io/$OWNER_LC/taskflow-migrations:latest \
            ./db

      - name: Push Docker images
        run: |
          docker push ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG
          docker push ghcr.io/$OWNER_LC/taskflow-api:latest

          docker push ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG
          docker push ghcr.io/$OWNER_LC/taskflow-web:latest

          docker push ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG
          docker push ghcr.io/$OWNER_LC/taskflow-migrations:latest

      - name: Create Kubernetes secrets
        env:
          TASKFLOW_API_TOKEN: ${{ secrets.TASKFLOW_API_TOKEN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic api-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=API_TOKEN="$TASKFLOW_API_TOKEN" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret generic postgres-secret \
            --namespace "$KUBE_NAMESPACE" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres-service:5432/$POSTGRES_DB" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-secret \
            --namespace "$KUBE_NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$OWNER_LC" \
            --docker-password="$GHCR_READ_TOKEN" \
            --docker-email="deadpoollyo@gmail.com" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Wait for PostgreSQL
        run: kubectl rollout status statefulset/postgres -n "$KUBE_NAMESPACE" --timeout=180s

      - name: Update migration image
        run: |
          kubectl delete job taskflow-migrations --ignore-not-found
          sed "s|ghcr.io/<GITHUB_OWNER>/taskflow-migrations:latest|ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG|g" k8s/base/migrations-job.yaml \
          | kubectl apply -n "$KUBE_NAMESPACE" -f -

      - name: Run database migrations
        run: |
          kubectl delete job taskflow-migrations -n "$KUBE_NAMESPACE" --ignore-not-found

          sed "s|ghcr.io/<GITHUB_OWNER>/taskflow-migrations:latest|ghcr.io/$OWNER_LC/taskflow-migrations:$IMAGE_TAG|g" k8s/base/migrations-job.yaml \
            | kubectl apply -n "$KUBE_NAMESPACE" -f -

          kubectl wait -n "$KUBE_NAMESPACE" --for=condition=complete job/taskflow-migrations --timeout=180s || (
            echo "Migration job did not complete. Debug info:"
            kubectl get jobs -n "$KUBE_NAMESPACE"
            kubectl describe job taskflow-migrations -n "$KUBE_NAMESPACE"
            kubectl get pods -n "$KUBE_NAMESPACE" -l app=taskflow-migrations -o wide
            kubectl describe pod -n "$KUBE_NAMESPACE" -l app=taskflow-migrations
            kubectl logs -n "$KUBE_NAMESPACE" job/taskflow-migrations --all-containers || true
            exit 1
          )

          kubectl logs -n "$KUBE_NAMESPACE" job/taskflow-migrations

      - name: Update deployment images
        run: |
          kubectl set image deployment/api api=ghcr.io/$OWNER_LC/taskflow-api:$IMAGE_TAG -n "$KUBE_NAMESPACE"
          kubectl set image deployment/web web=ghcr.io/$OWNER_LC/taskflow-web:$IMAGE_TAG -n "$KUBE_NAMESPACE"

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment api -n "$KUBE_NAMESPACE" --timeout=180s
          kubectl rollout status deployment web -n "$KUBE_NAMESPACE" --timeout=180s

      - name: Smoke test
        run: |
          curl -f http://$APP_HOST/api/health
          curl -f http://$APP_HOST/api/tasks
